services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poker
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/poker
      DB_USER: poker
      DB_PASSWORD: poker
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "8000:80"
    depends_on:
      - backend

volumes:
  pgdata:
